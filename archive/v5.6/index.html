function buffState(){
 const confidence=owned('confidence'),insurance=owned('insurance'),stakeholder=1+0.5*owned('stakeholder');
 const statue=!!owned('statue'),drink=!!owned('drink'),mic=!!owned('microphone');
 const camera=!!owned('camera')&&state.build.team==='group';
 // 同局净额归并之后再生效；神圣雕像勾选即防止亏损。
 const a=(1+.5*confidence)*(drink?2:1)*(mic?2:1);
 const refund=statue||mic?1:1-Math.pow(.75,insurance);
 return {a,b:1-refund,refund,confidence,insurance,stakeholder,statue,drink,mic,camera,
   cameraRate:camera?.25*stakeholder:0,mode:'pooled'};
}
function moneyNet(raw,gross,stake,bf){return settleNet(raw,bf);}
function settleNet(raw,bf=buffState()){
 let self=raw>0?raw*bf.a:raw<0?raw*bf.b:0;
 // 相机只拍队友；按成功捕捉一局、第一格充能并立即摔碎（利润的25%）估算额外团队收益。
 if(raw>0&&bf.camera)self+=raw*bf.a*bf.cameraRate;
 return self;
}
function portfolioEV(legs,scenarios,bf=buffState()){
 const invested=legs.reduce((z,w)=>z+w.stake,0),out=[];let ev=0,probPos=0,probZero=0,probAny=0,min=Infinity,max=-Infinity;
 for(const scenario of scenarios){let raw=0,winning=false;
  for(const w of legs){const gross=w.gross(scenario.id);raw+=w.stake*(gross-1);if(gross>0)winning=true;}
  const net=settleNet(raw,bf);
  ev+=scenario.prob*net;if(net>1e-8)probPos+=scenario.prob;else if(Math.abs(net)<=1e-8)probZero+=scenario.prob;
  if(winning)probAny+=scenario.prob;
  min=Math.min(min,net);max=Math.max(max,net);out.push({id:scenario.id,prob:scenario.prob,raw,net});
 }
 return {total:invested,ev,roi:invested>0?ev/invested:0,win:probPos,flat:probZero,lose:Math.max(0,1-probPos-probZero),any:probAny,min:invested?min:0,max:invested?max:0,out};
}

function bits(m){let n=0;while(m){m&=m-1;n++;}return n;}
async function solvePoker(){const pk=state.pk;if(pk.running)return;const ids=pk.cards.map(c=>13*suits.indexOf(c[1])+(valueOf(c)-2));if(new Set(ids).size!==5){$('results').innerHTML=result('输入错误',hero('alert','重复的牌','一副标准扑克牌内不会有两张点数和花色完全相同的牌，请修改后再计算。'));return;}pk.running=true;pk.hold=null;drawPoker();await new Promise(r=>setTimeout(r,40));const rem=deck.map(c=>c.id).filter(x=>!ids.includes(x));let best=-Infinity,bmask=0;const work=new Array(5),counts=new Int8Array(15);try{for(let mask=0;mask<32;mask++){let held=0;for(let i=0;i<5;i++)if(mask&(1<<i))work[held++]=ids[i];const need=5-held;let sum=0,n=0;function walk(start,depth){if(depth===need){sum+=buffedGross(handPay(work,counts));n++;return;}for(let j=start;j<=rem.length-(need-depth);j++){work[held+depth]=rem[j];walk(j+1,depth+1);}}
// 真实枚举全部 32 种保留方法（含一张也不保留）
walk(0,0);let ev=sum/n;if(ev>best+1e-12){best=ev;bmask=mask;}if(mask%2===0)await new Promise(r=>setTimeout(r,0));}
pk.hold=bmask;pk.ev=best;}catch(err){alert('计算失败：'+err.message);}finally{pk.running=false;drawPoker();}}
function buffedGross(g){return 1+settleNet(g-1);}

if(b.goal==='money'){if(['golden','confidence','taser','drink'].includes(it.id))s+=4;}
if(b.goal==='tickets'){if(it.id==='bonus'){s+=24;memo.push('盈利时额外 Ticket 的概率');}if(it.id==='quota')s-=8;}
if(b.goal==='challenge'){if(it.id==='time')s-=6;if(it.id==='bonus')s+=5;}

if(it.id==='stakeholder'){if(['golden','taser','statue','camera','drink','microphone','angel','devil'].some(id=>owned(id)))s+=13;else{s-=22;memo.push('目前缺乏受益道具');}}
if(it.id==='golden'&&owned('taser')){s+=8;memo.push('已拥有电击枪，可以先提高上限');}
if(it.id==='taser'&&owned('golden')){s+=7;memo.push('黄金筹码能吃到更高上限');}

 const comparison=variants?`<details class="guide"><summary>比较 ${variants.length} 种下注方案（看期望、盈利概率和最差结果）</summary><div class="floor-matrix-scroll"><table class="ladder-table"><thead><tr><th>方案（点选直接应用）</th><th>期望净收益</th><th>盈利率</th><th>最差结果 / 总下注</th></tr></thead><tbody>${variants.map(v=>`<tr><td style="text-align:left"><button class="btn mini plain tiny-btn" data-cmd="applyPlan" data-val="${g.id}:${v.key}">${v.name} ↗</button></td><td>${v.calc.roi>=0?'+':''}${pct(v.calc.roi)}</td><td>${pct(v.calc.win)}</td><td>${pct(v.calc.min/v.calc.total)}</td></tr>`).join('')}</tbody></table></div><p class="note">这里只比较金额比例，不规定实际下注额；期望收益率和最差结果都以「该方案总下注额」为分母。实际金额可自行设置，且需符合机器的单区和总投注限额。模型模式：整桌净额（轮盘零净额已实测，百家乐待验证）。</p></details>`:'';
 let controls='';if(p.action&&tool){controls=`<button class="btn mini" data-cmd="applyPlan" data-val="${g.id}:${p.action}">直接应用这套下注方案 →</button>`;}
 return `<article class="ranking-card ${n===0?'toprank':''}"><div class="ranking-head"><span class="rank-num">#${n+1}</span><span class="rank-name">${g.icon} ${g.name}</span><span class="tier ${tagForScore(c.score)}">推荐 ${c.score}/100</span></div>
 <div class="rec-action"><strong>推荐押法：${p.name}</strong><div class="instruction">${p.instruction}</div>${metrics}${protectedLine}</div>
 ${p.extras.length?`<div class="method-note"><b>你已有道具的用法：</b>${p.extras.slice(0,4).join(' ')}</div>`:''}

 <div class="row" style="margin-top:10px">${controls}${tool?`<button class="btn mini plain" data-cmd="goto" data-val="${g.id}">打开决策器 →</button>`:''}<a class="tool-link" style="margin:0" href="${g.url}" target="_blank" rel="noopener">参考攻略 ↗</a></div></article>`;
}
const floorNames={1:'入门楼层',2:'倍率玩法',3:'进阶赌桌',4:'全部游戏候选池'};
const floorCounts={1:6,2:9,3:11,4:16};
const extraExamples={1:'一楼可找到直接转倍率的 Wheel of Fortune，不是四色 Money Wheel。',2:'二楼新开放 Money Wheel 颜色下注；上一层的 Wheel of Fortune 不在常规候选池里。',3:'三楼恢复 Wheel of Fortune，并开放扑克、扫雷、龙塔与百家乐；Money Wheel 不在本层候选池。',4:'四楼的 16 种普通游戏全部有资格出现，但并不保证同一次进场全部刷出。'};
function drawFloors(){const f=state.build.floor,eligible=gameFacts.filter(g=>g.floors.includes(f));
 const floorControls=btnGroup([1,2,3,4].map(v=>[v,'F'+v]),String(f),'floor',4);
 const cards=eligible.map(g=>`<article class="floor-entry"><div><b>${g.icon} ${g.name}</b><div class="micro">${g.floors.map(i=>'F'+i).join(' · ')} · 首见 F${Math.min(...g.floors)}</div></div><div class="row" style="gap:5px">${tabs.some(t=>t[0]===g.id)?`<button class="btn mini" data-cmd="goto" data-val="${g.id}">打开助手</button>`:`<a class="tool-link" style="margin:0" href="${g.url}" target="_blank" rel="noopener">攻略 ↗</a>`}</div></article>`).join('');
 const matrix=gameFacts.slice().sort((a,b)=>Math.min(...a.floors)-Math.min(...b.floors)||a.name.localeCompare(b.name)).map(g=>`<tr><td>${g.icon} ${g.name}</td>${[1,2,3,4].map(i=>`<td style="text-align:center"><span class="floor-flag ${g.floors.includes(i)?'yes':'no'}">${g.floors.includes(i)?'✓':'—'}</span></td>`).join('')}</tr>`).join('');
 $('controls').innerHTML=`<h2>🏢 四层游戏图鉴 · 已重新核对</h2><p class="note">Steam 官方：4 层、17 种博彩玩法；v1.0.30 游戏池资料：<b>16 种普通赌场小游戏</b>。另一种是结果的抛硬币，而不是普通楼层赌桌。</p><div class="grid-floor">${[1,2,3,4].map(i=>`<button class="floor-tile ${f===i?'selected':''}" data-cmd="floor" data-val="${i}"><b>F${i}</b><strong>${floorCounts[i]}</strong><small>款候选</small></button>`).join('')}</div><h3>筛选楼层</h3>${floorControls}<div class="rank-banner"><b>F${f} · ${floorNames[f]}</b><p class="note">${extraExamples[f]}</p><p class="note">当前为<b>可出现</b>的游戏集合，不代表每次进场都刷齐。</p></div><p class="note">优先参考 <a href="https://steamcommunity.com/stats/3892270/achievements" target="_blank" rel="noopener">Steam 官方成就</a>，楼层池完整列表采用 <a href="https://gwyfguides.com/floors" target="_blank" rel="noopener">v1.0.30 整理的配置矩阵</a>。资料存在版本变化风险；部分聚合攻略把两种转盘或不同楼层混在一起，此处不采用。</p>`;
 $('results').innerHTML=result(`F${f} 当前候选：${eligible.length} / 16 种`,`<div class="floor-list">${cards}</div><details class="guide"><summary>展开全部 16 款 × 四楼层对照表</summary><div class="floor-matrix-scroll"><table class="ladder-table floor-matrix"><thead><tr><th>游戏名</th><th>F1</th><th>F2</th><th>F3</th><th>F4</th></tr></thead><tbody>${matrix}</tbody></table></div></details><div class="rank-banner"><b>为什么 Steam 写 17 种？</b><p class="note">配置资料把 <b>16 种普通赌场游戏</b>与<b>结果二选一时的 Coin Flip</b>分开列。后者不会出现在普通四层游戏池里。这是对公开总数的解释，并非 Steam 官方逐项提供的完整 17 项名单。</p></div>`);}
function drawRecommend(){const b=state.build,available=gameFacts.filter(g=>g.floors.includes(b.floor)).map(g=>({g,c:gameContext(g)})).sort((a,z)=>z.c.score-a.c.score),missing=gameFacts.filter(g=>!g.floors.includes(b.floor)),top=available[0];
 $('controls').innerHTML=`<h2>🏆 当前楼层 · 游戏推荐</h2>${configPicker()}<details class="guide" open><summary>🎒 已有道具 ${guideItems.filter(it=>owned(it.id)).length} 种 · 修改后全局同步</summary>${inventoryPicker()}</details>`;
 const featured='';
 $('results').innerHTML=result('F'+b.floor+' · 可出现 '+available.length+' 款游戏',featured+`<div class="ranking">${available.map((e,index)=>rankCard(e.g,index,e.c)).join('')}</div><details class="guide"><summary>未开放的 ${missing.length} 款</summary><div class="inline-tags">${missing.map(g=>'<span class="tiny">'+g.icon+' '+g.name+'</span>').join('')}</div></details>`);
}
function handleBuild(cmd,v){const b=state.build;if(cmd==='floor')b.floor=Number(v);if(cmd==='owned'){const it=guideItems.find(x=>x.id===v);if(it){const val=owned(v);b.owned[v]=it.type==='升级'?(val+1)%5:(val?0:1);}}if(cmd==='resetOwned')b.owned={};if(cmd==='goto'){state.tab=v;render();window.scrollTo({top:0,behavior:'instant'});return;}storeBuild();render();}

function handleCmd(cmd,v){if(cmd==='owned'||cmd==='resetOwned'){state.pk.hold=null;state.pk.ev=null;handleBuild(cmd,v);return;}if(cmd==='applyPlan'){const parts=v.split(':'),[id,key]=parts;if(id==='roulette'&&key){state.tab='roulette';if(key==='red'){state.roulette.wagers=[{key:'red',amount:state.roulette.base*state.roulette.multiple}];render();}else roulettePreset(key);}if(id==='baccarat'&&key){state.tab='baccarat';baccaratPreset(key);}if(id==='money'&&key&&moneyData[key]){state.tab='money';state.money.color=key;render();}return;}if(['recommend','items','floors'].includes(state.tab)){handleBuild(cmd,v);return;}switch(state.tab){case 'bj':bjChange(cmd,v);return;case 'poker':if(cmd==='solve')solvePoker();else if(cmd==='pickcard')showPokerWheel(Number(v));return;case 'mines':return;case 'fortune':return;case 'money':if(cmd==='mwcolor'){state.money.color=v;render();}return;case 'hilo':if(cmd==='side'){state.hilo.side=v;render();}return;case 'crash':if(cmd==='ctarget'){state.crash.target=+v;render();}return;case 'penguin':if(cmd==='pstep')state.penguin.step=Number(v);render();return;case 'dragon':if(cmd==='drow')state.dragon.rows=Number(v);render();return;case 'roulette':rouletteAct(cmd,v);return;case 'baccarat':baccaratAct(cmd,v);return;case 'craps':if(cmd==='roll')roll(v);else if(cmd==='newcraps'){state.craps={phase:0,point:0,left:3,msg:''};render();}return;}}
const numberKeys={mines:{mine:[1,24,1],k:[0,24,1]},crash:{target:[1.2,100,.1],profit:[1,20,.05],refund:[0,1,.01]},dragon:{rows:[0,6,1]},penguin:{step:[0,10,1]},roulette:{base:[.01,1e9,.01]},baccarat:{base:[.01,1e9,.01]}};
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){state.tab=t.dataset.tab;render();storeSession();window.scrollTo({top:0,behavior:'instant'});return;}t=e.target.closest('[data-cmd]');if(t)handleCmd(t.dataset.cmd,t.dataset.val);});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.build){state.build[t.dataset.build]=t.value;storeBuild();render();storeSession();return;}if(t.dataset.buildCheck==='team'){state.build.team=t.checked?'group':'solo';storeBuild();render();storeSession();return;}if(t.dataset.check){state.b[{bdouble:'double',bh17:'h17',bfirst:'first'}[t.dataset.check]]=t.checked;render();storeSession();return;}if(t.dataset.num){const key=t.dataset.num,arr=numberKeys[state.tab]?.[key];if(arr){const v=lim(Number(t.value)||0,arr[0],arr[1]);state[state.tab][key]=arr[2]===1?Math.round(v):v;render();storeSession();}return;}if(t.dataset.pkr!==undefined){state.pk.cards[+t.dataset.pkr][0]=t.value;state.pk.hold=null;drawPoker();storeSession();return;}if(t.dataset.pks!==undefined){state.pk.cards[+t.dataset.pks][1]=t.value;state.pk.hold=null;drawPoker();storeSession();return;}});
document.addEventListener('input',e=>{if(e.target.dataset.range==='threshold'){state.hilo.threshold=Number(e.target.value);const v=$('hlval');if(v)v.textContent=state.hilo.threshold+'%';drawHiLo(true);}});
function storeSession(){try{const fields=['roulette','baccarat','b','mines','hilo','money','fortune','crash','dragon','penguin','craps'];const obj={tab:state.tab,pkCards:state.pk.cards};for(const key of fields)obj[key]=state[key];localStorage.setItem('GWYF_SESSION_V54',JSON.stringify(obj));}catch(e){}}
function restoreSession(){try{const old=JSON.parse(localStorage.getItem('GWYF_SESSION_V54')||'null');if(!old||typeof old!=='object')return;for(const key of ['roulette','baccarat','b','mines','hilo','money','fortune','crash','dragon','penguin','craps']){if(old[key]&&typeof old[key]==='object')state[key]={...state[key],...old[key]};}if(Array.isArray(old.pkCards)&&old.pkCards.length===5)state.pk.cards=old.pkCards;if(tabs.some(t=>t[0]===old.tab))state.tab=old.tab;state.money={color:moneyData[state.money.color]?state.money.color:'orange'};state.fortune={};for(const id of ['roulette','baccarat']){const v=state[id];v.base=lim(Number(v.base)||10,.01,1e9);v.multiple=[1,2,5,10].includes(Number(v.multiple))?Number(v.multiple):1;v.wagers=Array.isArray(v.wagers)?v.wagers.filter(w=>w&&typeof w.key==='string'&&Number.isFinite(w.amount)&&w.amount>0&&w.amount<1e12).slice(0,500):[];v.last=null;}}catch(e){}}
const baseHandleCmd=handleCmd;handleCmd=function(cmd,v){baseHandleCmd(cmd,v);storeSession();};
restoreBuild();restoreSession();render();})();
</script></body></html>
