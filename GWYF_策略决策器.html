function modelSummary(){const b=buffs();return `<div class="chips">${chip('正利润 ×'+f(b.a,2))}${chip('亏损保留 '+pc(b.b))}${b.camera?chip('含'+owned('camera')+'台相机单拍 +'+pc(b.cameraRate),'unknown'):''}${b.bonusChance?chip('盈利后额外抽签 '+pc(b.bonusChance,0),'neutral'):''}</div>`;}
function scenarioSummary(o,unit=true){return `${resultBar(o)}<div class="stats">${stat(unit?'期望净收益率':'期望净收益',unit?sp(o.roi):signed(o.ev),o.ev>=-1e-9?'positive':'negative')}${stat('净盈利概率',pc(o.win))}${stat(unit?'最差净收益率':'最差净盈亏',unit?sp(o.min/o.total):signed(o.min),o.min<0?'negative':'')}${stat(unit?'最好净收益率':'最好净盈亏',unit?sp(o.max/o.total):signed(o.max),'positive')}</div>${buffs().bonusChance?`<div class="chips">${chip('每轮额外Ticket期望 '+f(o.win*buffs().bonusChance,3),'neutral')}</div>`:''}`;}

function setPath(path,value){const keys=path.split('.');let obj=state;for(let i=0;i<keys.length-1;i++){if(!Object.hasOwn(obj,keys[i]))return;obj=obj[keys[i]];}const key=keys.at(-1);if(!Object.hasOwn(obj,key))return;const d=obj[key];if(typeof d==='number'){const n=typeof value==='number'?value:Number(value);if(!Number.isFinite(n)){toast('请输入有效数字');return;}obj[key]=cleanNumber(n,d,path);}else if(typeof d==='boolean')obj[key]=!!value;else if(enums[path]?.includes(value))obj[key]=value;else if(path==='budget.label')obj[key]=String(value).slice(0,60);else return;
 if(state.bj.type==='hard'&&state.bj.hard>=21)state.bj.first=false;
 if(path.startsWith('settings.')||path==='profile.team'||path.startsWith('poker.'))invalidatePoker();state.mines.k=Math.min(state.mines.k,25-state.mines.mine);save();render();}

function render(){if(pointerBusy){renderPending=true;return;}const opened=new Set([...document.querySelectorAll('#content details[open]')].map(d=>d.dataset.detail));const active=document.activeElement;const focusKey=active?.dataset.path?['data-path',active.dataset.path]:active?.dataset.itemCount?['data-item-count',active.dataset.itemCount]:active?.dataset.action&&active?.dataset.value?['data-action',active.dataset.action,'data-value',active.dataset.value]:null;const navScroll=$('nav').scrollTop;renderChrome();$('nav').scrollTop=navScroll;const draws={recommend:drawOverview,items:drawItems,roulette:drawRoulette,baccarat:drawBaccarat,poker:drawPoker,bj:drawBJ,craps:drawCraps,money:drawMoney,fortune:drawFortune,hilo:drawHiLo,crash:drawCrash,dragon:()=>drawLadder('dragon'),penguin:()=>drawLadder('penguin'),mines:drawMines,keno:drawKeno,duck:drawDuck,plinko:drawPlinko,slots:drawSlots,camera:drawCamera,budget:drawBudget,floors:drawFloors,sources:drawSources};$('content').innerHTML=draws[state.tab]();renderInlineDecision();document.querySelectorAll('#content details').forEach(d=>{if(opened.has(d.dataset.detail))d.open=true;});if(focusKey){let selector=`[${focusKey[0]}="${CSS.escape(focusKey[1])}"]`;if(focusKey.length>2)selector+=`[${focusKey[2]}="${CSS.escape(focusKey[3])}"]`;document.querySelector('#content '+selector)?.focus({preventScroll:true});}}
function renderInlineDecision(){
 const content=$('content'),right=content.querySelector('#resultRegion'),first=content.querySelector('.workspace > .stack > .panel');
 content.querySelectorAll('.inline-decision').forEach(n=>n.remove());
 if(!right||!first||state.tab==='roulette')return;
 const source=right.querySelector('.hero-result'),error=right.querySelector('.alert.error');if(!source&&!error)return;
 const card=document.createElement('div');card.className='inline-decision'+(source?.classList.contains('caution')||error?' caution':'');card.dataset.for=state.tab;
 const caption=document.createElement('div');caption.className='inline-decision-caption';caption.textContent=source?.querySelector('.kicker')?.textContent||'输入提示';
 const title=document.createElement('strong');title.className='inline-decision-title';title.textContent=source?.querySelector('.decision')?.textContent||'请先检查输入';
 const desc=document.createElement('p');desc.textContent=source?.querySelector('p')?.textContent||error.textContent;card.append(caption,title,desc);
 const selectors={bj:'.bj-selection',poker:'[data-action="solvePoker"], [data-action="cancelPoker"]',baccarat:'.bacc-table',money:'.choices',fortune:'.wheel-visual',hilo:'.grid2',crash:'input[data-path="crash.target"]',dragon:'.ladder-track',penguin:'.ladder-track',mines:'[data-action="mineReset"]',keno:'.choices',plinko:'.ladder-track',slots:'.slot-board',craps:'.choices',budget:'.grid2'};
 let anchor=first.querySelector(selectors[state.tab]||':scope > h2');
 if(state.tab==='bj'&&anchor){(anchor.querySelector('.bj-live-decision')||anchor).append(card);return;}
 if(state.tab==='crash')anchor=anchor?.closest('.field');

function inventory(){

 case 'keno':{const n=p.goal==='safe'?6:p.goal==='tickets'?4:1;return {o:E.distribution(E.kenoRows(n,1),b),plan:'选 '+n+' 个号码',detail:n===6?'6选的基础方差较低。':n===4?'4选在基础配置下最容易单轮净盈利。':'1选正利润进度较高，约79%轮次无返还。',action:String(n)};}

 case 'baccarat':{const key=p.goal==='safe'?'player':'tie';return {o:E.portfolio([{key,amount:1}],'baccarat',b),plan:key==='tie'?'单押和局':'单押庄或闲',detail:key==='tie'?'和局基础返还率较高，但约90.10%轮次落空。':'庄闲同概率同赔率，命中率约45.05%。'};}

 case 'duck':return {o:E.single(E.duckBaseline.p,E.duckBaseline.g,b),plan:'选择一只鸭',detail:'每鸭25%是对称假设；没有经过验证的常胜鸭。'};

function rankedGames(){return gameFacts.filter(g=>g.floors.includes(state.profile.floor)).map(g=>{const m=singleModel(g.id),o=m.o;const risk=state.profile.goal==='safe'||state.profile.risk==='careful';let score=o?o.roi*90+o.win*(risk?38:8)-o.sd*(risk?8:1.4):g.id==='poker'?10:g.id==='slots'?5:0;if(['craps','duck'].includes(g.id))score-=6;return {g,m,score};}).sort((x,y)=>y.score-x.score);}

 if(action==='recordBudget'){const net=state.budget.net;if(!net){toast('请填写这次实际净盈亏。');return;}if(state.profile.bankroll+net<0){toast('净亏损超过记录余额，请核对余额与金额。');return;}state.profile.bankroll=E.clamp(state.profile.bankroll+net,0,1e15);state.history.unshift({net,label:state.budget.label||meta[state.tab][1],time:new Date().toISOString()});state.history=state.history.slice(0,200);state.budget.net=0;state.budget.label='';commit();toast('实际盈亏已记录，工具余额已更新。');return;}
 if(action==='removeBudget'){const i=Number(v),r=state.history[i];if(!r)return;if(state.profile.bankroll-r.net<0){toast('余额后来已被修改，无法直接回滚此条；请先核对当前余额。');return;}state.profile.bankroll=E.clamp(state.profile.bankroll-r.net,0,1e15);state.history.splice(i,1);commit();return;}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.path){if(t.type==='number'&&!Number.isFinite(t.valueAsNumber)){toast('请输入有效数字，已保留上一次设置。');render();return;}setPath(t.dataset.path,t.type==='checkbox'?t.checked:t.type==='number'?t.valueAsNumber:t.value);return;}
 if(t.dataset.itemCount){changeItem(t.dataset.itemCount,t.value);return;}
 if(t.dataset.wagerKind){const kind=t.dataset.wagerKind,key=t.dataset.wagerKey,n=Number(t.value);if(!Number.isFinite(n)||n<0){toast('请输入非负金额。');render();return;}rememberTable(kind);state[kind].wagers=state[kind].wagers.filter(w=>w.key!==key);const amount=Math.round(Math.min(n,1e12)*100)/100;if(amount>0)state[kind].wagers.push({key,amount});commit();}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='navSearch'){search=t.value;renderNav();return;}if(t.dataset.range==='hilo'){state.hilo.threshold=Number(t.value);const oldFocus=document.activeElement;const holder=$('content');const next=document.createElement('div');next.innerHTML=drawHiLo();const currentRight=holder.querySelector('#resultRegion'),newRight=next.querySelector('#resultRegion');if(currentRight&&newRight)currentRight.innerHTML=newRight.innerHTML;const label=holder.querySelector('.row.between .gold');if(label)label.textContent=t.value+'%';const exact=holder.querySelector('[data-path="hilo.threshold"]');if(exact)exact.value=t.value;renderInlineDecision();save();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeNav();return;}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!$('cardPicker')){e.preventDefault();if(innerWidth<=760){$('sidebar').classList.add('open');$('navShade').classList.add('show');}$('navSearch').focus();}});
$('navShade').addEventListener('click',closeNav);
$('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('文件超过2MB，请选择本工具导出的JSON存档。');const obj=JSON.parse(await file.text());if(obj.version!==VERSION||!obj.state||typeof obj.state!=='object'||Array.isArray(obj.state))throw Error('这不是v7决策器存档；原版浏览器数据会在首次打开时自动尝试迁移。');const next=normalize(obj.state);pokerEntryUndo=[];bjArchiveUndo=null;invalidatePoker();state=next;tableUndo={roulette:[],baccarat:[]};commit();toast('存档已导入并校验。');}catch(err){toast('导入失败：'+err.message);}finally{e.target.value='';}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(meta[id]&&id!==state.tab)navigate(id);});
function updateNavOffset(){document.documentElement.style.setProperty('--nav-offset',(document.querySelector('.topbar').offsetHeight+12)+'px');}
if(typeof ResizeObserver!=='undefined'){const navObserver=new ResizeObserver(updateNavOffset);navObserver.observe(document.querySelector('.topbar'));}else window.addEventListener('resize',updateNavOffset);
readStored();if(meta[location.hash.slice(1)])state.tab=location.hash.slice(1);save();render();focusGameControls();

})();
